  <text x="1071" y="416" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="10" fill="#283629" text-anchor="middle">Phân bổ 2 chủ đề còn lại</text>

  <path d="M 938 401 L 972 401" stroke="#2E7D52" stroke-width="1.8" fill="none" marker-end="url(#arr-success)" />
  <text x="955" y="392" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#2E7D52" text-anchor="middle">Có</text>

  <!-- Update Loop -->
  <rect x="242" y="472" width="536" height="58" rx="14" fill="#FAF6EC" stroke="#2E7D52" stroke-width="1.5" />
