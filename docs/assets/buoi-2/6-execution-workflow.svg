  <rect x="48" y="132" width="528" height="94" rx="12" fill="#2F4231" />
  <text x="68" y="158" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#F4EFE2">Buoc 0: Tao nhanh &amp; thu muc lam viec</text>
  <text x="68" y="180" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#C6D1BF">git checkout -b feature/buoi-2-static-bento-layout</text>
  <text x="68" y="202" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#F4EFE2">Tai sao can: Co lap code thu nghiem, giu nhanh main luon sach.</text>

  <line x1="578" y1="179" x2="616" y2="179" stroke="#4F7043" stroke-width="2" />
  <polygon points="614,173 624,179 614,185" fill="#4F7043" />

  <rect x="626" y="132" width="526" height="94" rx="12" fill="#F1ECDD" stroke="#DDD6C3" />
  <text x="646" y="158" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#283629">Buoc 1: Tao tokens.css (Bien :root + box-sizing)</text>
  <text x="646" y="180" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#4F7043">Viet tai: styles/tokens.css</text>
  <text x="646" y="202" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#546353">Tai sao can: Moi tep CSS sau dung var(--...), sua 1 noi doi toan trang.</text>

  <!-- Connector Phase 1 -> Phase 2 -->
