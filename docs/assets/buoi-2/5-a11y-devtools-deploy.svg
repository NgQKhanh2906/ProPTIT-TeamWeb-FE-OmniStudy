  <text x="646" y="370" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4F7043">|-- index.html                 (&lt;link href="./styles/tokens.css"&gt;)</text>
  <text x="646" y="392" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#546353">`-- styles/</text>
  <text x="646" y="414" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#546353">    |-- tokens.css             (Bien mau, font, spacing, radius)</text>
  <text x="646" y="436" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#546353">    |-- layout.css             (Shell 248px + Grid 12 cot)</text>
  <text x="646" y="458" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#546353">    `-- components.css         (Banner, Countdown, Task, Motion)</text>

