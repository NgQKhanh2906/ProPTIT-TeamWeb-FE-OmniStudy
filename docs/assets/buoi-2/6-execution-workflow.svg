  <rect x="920" y="33" width="232" height="28" rx="14" fill="#E3F2EA" stroke="#9ACBAE" stroke-width="1" />
  <text x="1036" y="51" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#2E7D52" text-anchor="middle">6 Buoc Tuan Tu · Zero Guess</text>

