  <text x="510" y="516" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#546353" text-anchor="middle">Cập nhật tổng giờ Daily Stats (tabular-nums) và đẩy lên lịch tuần</text>

  <path d="M 1071 436 L 1071 501 L 780 501" stroke="#2E7D52" stroke-width="1.8" fill="none" marker-end="url(#arr-success)" />
  <path d="M 304 472 L 304 308" stroke="#2E7D52" stroke-width="1.8" fill="none" marker-end="url(#arr-success)" />

  <!-- Bottom Edge States Bar -->
  <rect x="32" y="552" width="1136" height="64" rx="14" fill="#FAF6EC" stroke="#DDD6C3" stroke-width="1" />
  <text x="54" y="578" font-family="'Fraunces', 'Lora', Georgia, serif" font-size="12" font-weight="700" fill="#283629">QUY TẮC 3 TRẠNG THÁI BIÊN BẮT BUỘC TRÊN MỌI MÀN HÌNH:</text>
  <text x="54" y="599" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="11.5" fill="#546353">1) Loading: Warm Shimmer Skeleton (@keyframes warmShimmer #F1ECDD/#FAF6EC)   |   2) Empty: Hướng dẫn + CTA (#4F7043)   |   3) Error: Alert #B94435 trên #FBEAE7 + Thử lại</text>
