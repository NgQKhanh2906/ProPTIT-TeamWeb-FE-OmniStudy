  <text x="1084" y="210" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#2E7D52" text-anchor="middle">#546353 &gt;5.8:1</text>

  <!-- Row 2 Left: 4 DevTools Checks -->
  <rect x="28" y="272" width="560" height="324" rx="16" fill="#FAF6EC" stroke="#DDD6C3" stroke-width="1.5" />
  <text x="48" y="304" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#283629">B. 4 Buoc Kiem Chung Tren Chrome DevTools</text>

  <rect x="48" y="322" width="520" height="56" rx="10" fill="#F1ECDD" stroke="#DDD6C3" />
  <text x="64" y="345" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#283629">1. Elements -&gt; Grid Overlay</text>
  <text x="64" y="364" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#546353">Bat huy hieu "grid" tren .bento-grid va .countdown-grid de soi duong chia 5/7, 8/4 va 4 o</text>

  <rect x="48" y="388" width="520" height="56" rx="10" fill="#F1ECDD" stroke="#DDD6C3" />
  <text x="64" y="411" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#283629">2. Device Toolbar (Ctrl + Shift + M)</text>
  <text x="64" y="430" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#546353">Do tai 375px (Mobile), 768px (Tablet), 1440px (Desktop) - Xac nhan overflow-x = 0</text>

  <rect x="48" y="454" width="520" height="56" rx="10" fill="#F1ECDD" stroke="#DDD6C3" />
  <text x="64" y="477" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#283629">3. Rendering -&gt; prefers-reduced-motion: reduce</text>
  <text x="64" y="496" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#546353">Kiem tra may tren ScenicBanner ngung troi va the khong dich chuyen khi hover</text>

  <rect x="48" y="520" width="520" height="56" rx="10" fill="#E3F2EA" stroke="#9ACBAE" />
  <text x="64" y="543" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E7D52">4. Lighthouse -&gt; Accessibility Audit</text>
  <text x="64" y="562" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#2E7D52">Dat diem &gt;= 90 o ca che do Mobile va Desktop truoc khi day len GitHub Pages</text>

  <!-- Row 2 Right: Static Structure & GitHub Pages Deploy -->
  <rect x="608" y="272" width="564" height="324" rx="16" fill="#FAF6EC" stroke="#9B6B43" stroke-width="1.5" />
