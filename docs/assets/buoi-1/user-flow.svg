  <text x="1148" y="50" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#C6D1BF" text-anchor="end">ForestSidebar + ScenicBanner + 3 Màn Chính + Google Calendar API v3</text>

